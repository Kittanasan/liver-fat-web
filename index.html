<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>จำแนกระดับไขมันในตับ</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--tx:#0f172a;--mut:#64748b;--bd:#e2e8f0;--ac:#2563eb}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c2e;--tx:#e5e7eb;--mut:#94a3b8;--bd:#24304a;--ac:#3b82f6}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--tx)}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.4rem;margin:8px 0 4px}p.s{color:var(--mut);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
#drop{border:2px dashed var(--bd);border-radius:12px;padding:32px 12px;text-align:center;cursor:pointer;color:var(--mut)}
#drop.on{border-color:var(--ac);color:var(--ac)}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-size:1rem;cursor:pointer;width:100%;margin-top:12px}
button.alt{background:transparent;color:var(--ac);border:1px solid var(--bd)}
button:disabled{opacity:.5;cursor:default}
canvas{max-width:100%;height:auto;border-radius:10px;display:block;margin:12px auto 0}
.v{font-size:1.5rem;font-weight:700;margin:0}.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%}.row{display:flex;justify-content:space-between;font-size:.9rem}
.err{color:#dc2626}.hide{display:none}
</style></head><body><main>
<h1>จำแนกระดับเม็ดไขมันในตับ</h1>
<p class="s">อัปโหลดภาพเนื้อตับ ระบบประเมินด้วยแบบจำลอง liverV1 <b>ในเบราว์เซอร์ของคุณเอง</b> ภาพไม่ถูกส่งไปที่ไหน</p>
<div class="card">
  <div id="drop">แตะหรือวางภาพที่นี่ (JPG / PNG)</div>
  <input id="file" type="file" accept="image/*" class="hide">
  <button id="go" disabled>จำแนกภาพ</button>
  <button id="demo" class="alt">ลองใช้ภาพตัวอย่าง</button>
  <p id="msg" class="s" style="margin-top:10px">กำลังโหลดแบบจำลอง…</p>
</div>
<div id="res" class="card hide">
  <p class="v" id="verdict"></p><p class="s" id="advice"></p>
  <div id="bars"></div>
  <canvas id="cv"></canvas>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const NAMES=["Hight","Low","Medium"];                 // ลำดับคลาสของ liverV1.pt
const COL={Hight:"#ef4444",Medium:"#f59e0b",Low:"#22c55e"},TH={Hight:"สูง",Medium:"ปานกลาง",Low:"ต่ำ"};
const ADV={Hight:"ตรวจพบเม็ดไขมันมาก",Medium:"ตรวจพบเม็ดไขมันปานกลาง",Low:"ตรวจพบเม็ดไขมันน้อย"};
const SZ=640,CONF=0.25,IOU=0.7;
let session=null,img=null;

async function loadModel(){
  try{
    ort.env.wasm.numThreads=1;
    session=await ort.InferenceSession.create("liverV1.onnx",{executionProviders:["wasm"]});
    $("msg").textContent="พร้อมใช้งาน — เลือกภาพได้เลย";
    $("go").disabled=!img;if(img&&location.hash==="#auto")run();
  }catch(e){$("msg").className="s err";$("msg").textContent="โหลดแบบจำลองไม่สำเร็จ: "+e.message}
}
function setImg(src){
  const i=new Image();i.onload=()=>{img=i;$("go").disabled=!session;$("msg").textContent=session?"พร้อมจำแนก กดปุ่ม \"จำแนกภาพ\"":"กำลังโหลดแบบจำลอง…";
    if(location.hash==="#auto"&&session)run()};
  i.src=src;
}
function pickFile(x){if(x)setImg(URL.createObjectURL(x))}
$("drop").onclick=()=>$("file").click();$("file").onchange=e=>pickFile(e.target.files[0]);
$("drop").ondragover=e=>{e.preventDefault();$("drop").classList.add("on")};
$("drop").ondragleave=()=>$("drop").classList.remove("on");
$("drop").ondrop=e=>{e.preventDefault();$("drop").classList.remove("on");pickFile(e.dataTransfer.files[0])};
$("demo").onclick=()=>setImg("sample.jpg");
$("go").onclick=run;

function iou(a,b){const x1=Math.max(a[0],b[0]),y1=Math.max(a[1],b[1]),x2=Math.min(a[2],b[2]),y2=Math.min(a[3],b[3]);
  const i=Math.max(0,x2-x1)*Math.max(0,y2-y1);return i/((a[2]-a[0])*(a[3]-a[1])+(b[2]-b[0])*(b[3]-b[1])-i+1e-9)}

async function run(){
  if(!img||!session)return;
  $("go").disabled=true;$("msg").className="s";$("msg").textContent="กำลังประเมิน…";
  await new Promise(r=>setTimeout(r,30));
  try{
    const w=img.naturalWidth,h=img.naturalHeight,r=Math.min(SZ/w,SZ/h);
    const nw=Math.round(w*r),nh=Math.round(h*r),px=Math.floor((SZ-nw)/2),py=Math.floor((SZ-nh)/2);
    const c=document.createElement("canvas");c.width=c.height=SZ;const g=c.getContext("2d");
    g.fillStyle="rgb(114,114,114)";g.fillRect(0,0,SZ,SZ);g.drawImage(img,px,py,nw,nh);
    const d=g.getImageData(0,0,SZ,SZ).data,n=SZ*SZ,t=new Float32Array(3*n);
    for(let i=0;i<n;i++){t[i]=d[i*4]/255;t[n+i]=d[i*4+1]/255;t[2*n+i]=d[i*4+2]/255}
    const out=(await session.run({images:new ort.Tensor("float32",t,[1,3,SZ,SZ])}))[session.outputNames[0]];
    const o=out.data,N=out.dims[2],nc=out.dims[1]-4;
    let cand=[];
    for(let i=0;i<N;i++){
      let best=0,bc=-1;for(let k=0;k<nc;k++){const s=o[(4+k)*N+i];if(s>best){best=s;bc=k}}
      if(best<CONF)continue;
      const cx=o[i],cy=o[N+i],bw=o[2*N+i],bh=o[3*N+i];
      cand.push({cls:bc,conf:best,box:[(cx-bw/2-px)/r,(cy-bh/2-py)/r,(cx+bw/2-px)/r,(cy+bh/2-py)/r]});
    }
    cand.sort((a,b)=>b.conf-a.conf);const dets=[];
    for(const a of cand){if(dets.every(b=>b.cls!==a.cls||iou(a.box,b.box)<IOU))dets.push(a)}
    show(dets,w,h);
  }catch(e){$("msg").className="s err";$("msg").textContent="เกิดข้อผิดพลาด: "+e.message}
  $("go").disabled=false;
}

function show(dets,w,h){
  const sc={Hight:0,Medium:0,Low:0},cn={Hight:0,Medium:0,Low:0};
  dets.forEach(d=>{const k=NAMES[d.cls];cn[k]++;sc[k]=Math.max(sc[k],d.conf)});
  const cv=$("cv"),g=cv.getContext("2d");cv.width=w;cv.height=h;g.drawImage(img,0,0);
  const lw=Math.max(2,Math.min(w,h)/200),fs=Math.max(14,Math.min(w,h)/35);g.font=`bold ${fs}px sans-serif`;g.lineWidth=lw;
  dets.forEach(d=>{const k=NAMES[d.cls],[x1,y1,x2,y2]=d.box;g.strokeStyle=COL[k];g.fillStyle=COL[k];g.strokeRect(x1,y1,x2-x1,y2-y1);
    const t=`${k} ${Math.round(d.conf*100)}%`,tw=g.measureText(t).width+8,ty=Math.max(0,y1-fs-4);
    g.fillRect(x1,ty,tw,fs+4);g.fillStyle="#0b1220";g.fillText(t,x1+4,ty+fs-1)});
  if(dets.length){const k=NAMES[dets[0].cls];
    $("verdict").textContent=`${TH[k]} (${(dets[0].conf*100).toFixed(1)}%)`;$("verdict").style.color=COL[k];$("advice").textContent=ADV[k];
  }else{$("verdict").textContent="ไม่พบเม็ดไขมันที่ชัดเจน";$("verdict").style.color="inherit";$("advice").textContent="ลองใช้ภาพที่ชัดและได้สัดส่วนกว่านี้"}
  $("bars").innerHTML=["Hight","Medium","Low"].map(k=>{const p=Math.round(sc[k]*100);
    return `<div class="row"><span>${TH[k]} · พบ ${cn[k]} จุด</span><span>${p}%</span></div><div class="bar"><i style="width:${p}%;background:${COL[k]}"></i></div>`}).join("");
  $("res").classList.remove("hide");$("msg").textContent="เสร็จแล้ว";
  document.title="RESULT "+JSON.stringify({n:dets.length,cn,top:dets[0]&&[NAMES[dets[0].cls],+dets[0].conf.toFixed(3)]});
}
loadModel();
if(location.hash==="#auto")setImg("sample.jpg");
</script></body></html>
